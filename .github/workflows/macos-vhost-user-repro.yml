# Local experiment, not intended for upstream.
#
# Try to reproduce the vhost-user/reconnect qtest failure
#   ERROR:tests/qtest/vhost-user-test.c:wait_for_fds: assertion failed: (s->fds_num)
# on macOS.  On FreeBSD it reproduces reliably when six qtests run in
# parallel (make -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 ..."), and the
# cause is the socket chardev's G_IO_HUP-only watch not being woken when the
# vhost-user backend closes its side.  This job repeats that recipe on the
# GitHub macOS runners and reports whether the assertion showed up.

name: macOS vhost-user reconnect repro

on:
  push:
    branches:
      - claude/macos-vhost-user-repro
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      PPC64_TESTS: >-
        qtest-ppc64/qos-test
        qtest-ppc64/device-introspect-test
        qtest-ppc64/cdrom-test
        qtest-ppc64/migration-test
        qtest-ppc64/prom-env-test
        qtest-ppc64/boot-serial-test
      RECONNECT: /ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus/virtio-net-pci/virtio-net/virtio-net-tests/vhost-user/reconnect
    steps:
      - uses: actions/checkout@v4

      - name: Host info
        run: |
          sw_vers
          uname -a
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string

      - name: Install dependencies
        run: |
          brew update
          brew install bash coreutils dtc gettext glib gnu-sed make meson ninja pixman pkgconf python3

      - name: Configure
        run: |
          mkdir build
          cd build
          prefix=$(brew --prefix)
          ../configure \
            --extra-cflags="-I$prefix/include" \
            --extra-ldflags="-L$prefix/lib" \
            --target-list=ppc64-softmmu \
            --enable-vhost-user \
            --disable-virtfs \
            --disable-docs \
            --disable-rust \
            --disable-plugins \
            --disable-werror \
            || { cat config.log meson-logs/meson-log.txt; exit 1; }

      - name: Build
        run: cd build && gmake -j$(sysctl -n hw.ncpu)

      - name: Build tests
        run: cd build && gmake -j$(sysctl -n hw.ncpu) check-build

      - name: Sanity run (unloaded, vhost-user subtests once)
        id: sanity
        continue-on-error: true
        run: |
          cd build
          QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img \
            ./tests/qtest/qos-test -p ${RECONNECT%/reconnect}

      - name: Stress run (six qtests in parallel, five repetitions)
        id: stress
        continue-on-error: true
        run: |
          cd build
          gmake -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 $PPC64_TESTS" 2>&1 | tee ../stress.log

      - name: Reconnect loop under CPU load
        id: loop
        continue-on-error: true
        run: |
          cd build
          n=$(sysctl -n hw.ncpu)
          hogs=""
          for i in $(seq 1 $((n * 2))); do yes > /dev/null & hogs="$hogs $!"; done
          fails=0
          for i in $(seq 1 30); do
            if QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img \
                 ./tests/qtest/qos-test -p $RECONNECT > ../loop-$i.log 2>&1; then
              echo "iteration $i: ok"
            else
              echo "iteration $i: FAILED"
              fails=$((fails + 1))
            fi
          done
          kill $hogs
          echo "loop failures: $fails/30"
          echo "loop_failures=$fails" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## vhost-user/reconnect on ${{ matrix.os }}"
            echo
            echo "Sanity step outcome: ${{ steps.sanity.outcome }}"
            echo "Stress step outcome: ${{ steps.stress.outcome }}"
            echo "Loop failures: ${{ steps.loop.outputs.loop_failures }}/30"
            echo
            if grep -rq 'wait_for_fds: assertion failed' stress.log loop-*.log build/meson-logs 2>/dev/null; then
              echo "**REPRODUCED**: wait_for_fds assertion seen"
            else
              echo "**NOT REPRODUCED**: wait_for_fds assertion not seen"
            fi
            echo
            echo '```'
            grep -h -E 'vhost-user/reconnect|^Ok:|^Fail:|^Timeout:|Summary of Failures|qos-test +(OK|ERROR|FAIL|TIMEOUT)' stress.log 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -rl 'wait_for_fds: assertion failed' stress.log loop-*.log build/meson-logs 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            stress.log
            loop-*.log
            build/meson-logs/
            build/config.log
          if-no-files-found: ignore
