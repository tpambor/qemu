# Local experiment, not intended for upstream.
#
# Try to reproduce the vhost-user/reconnect qtest failure
#   ERROR:tests/qtest/vhost-user-test.c:wait_for_fds: assertion failed: (s->fds_num)
# on macOS and Linux.  On FreeBSD it reproduces reliably when six qtests run
# in parallel (make -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 ..."), and
# the cause is the socket chardev's G_IO_HUP-only watch not being woken when
# the vhost-user backend closes its side.  This job repeats that recipe on
# the GitHub macOS (Apple silicon) and Ubuntu runners and reports whether the
# assertion showed up.

name: vhost-user reconnect repro (macOS and Ubuntu)

on:
  push:
    branches:
      - claude/macos-vhost-user-repro
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      PPC64_TESTS: >-
        qtest-ppc64/qos-test
        qtest-ppc64/device-introspect-test
        qtest-ppc64/cdrom-test
        qtest-ppc64/migration-test
        qtest-ppc64/prom-env-test
        qtest-ppc64/boot-serial-test
      RECONNECT: /ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus/virtio-net-pci/virtio-net/virtio-net-tests/vhost-user/reconnect
      PCI_BUS: /ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus
      QTEST_QEMU_STORAGE_DAEMON_BINARY: ./storage-daemon/qemu-storage-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Host info
        run: |
          uname -a
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
            echo "NCPU=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
            echo "MAKE=gmake" >> "$GITHUB_ENV"
          else
            cat /etc/os-release | head -2
            nproc; free -g | head -2
            echo "NCPU=$(nproc)" >> "$GITHUB_ENV"
            echo "MAKE=make" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install bash coreutils dtc gettext glib gnu-sed make meson ninja pixman pkgconf python3

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libcap-ng-dev libattr1-dev

      - name: Configure
        run: |
          mkdir build
          cd build
          extra=""
          if [ "$RUNNER_OS" = macOS ]; then
            prefix=$(brew --prefix)
            extra="--extra-cflags=-I$prefix/include --extra-ldflags=-L$prefix/lib"
          fi
          ../configure $extra \
            --target-list=ppc64-softmmu \
            --enable-vhost-user \
            --enable-vhost-user-blk-server \
            --disable-docs \
            --disable-rust \
            --disable-plugins \
            --disable-werror \
            || { cat config.log meson-logs/meson-log.txt; exit 1; }

      - name: Build
        run: cd build && $MAKE -j$NCPU

      - name: Build tests
        run: cd build && $MAKE -j$NCPU check-build

      - name: All qos tests (unloaded, once, no arguments)
        id: virtio
        continue-on-error: true
        run: |
          cd build
          QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img \
            ./tests/qtest/qos-test 2>&1 | tee ../virtio.log
          ! grep -q '^not ok' ../virtio.log

      - name: Diagnostic run (migrate subtest with vhost-user and chardev tracing)
        continue-on-error: true
        run: |
          cd build
          QTEST_QEMU_BINARY="./qemu-system-ppc64 -trace vhost_user_* -trace chr_socket_*" \
          QTEST_QEMU_IMG=./qemu-img \
            ./tests/qtest/qos-test -p ${RECONNECT%/reconnect}/migrate 2>&1 | tee ../diag.log

      - name: Stress run (six qtests in parallel, five repetitions)
        id: stress
        continue-on-error: true
        run: |
          cd build
          $MAKE -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 $PPC64_TESTS" 2>&1 | tee ../stress.log

      - name: Reconnect loop under CPU load
        id: loop
        continue-on-error: true
        run: |
          cd build
          hogs=""
          for i in $(seq 1 $((NCPU * 2))); do yes > /dev/null & hogs="$hogs $!"; done
          fails=0
          for i in $(seq 1 30); do
            if QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img \
                 ./tests/qtest/qos-test -p $RECONNECT > ../loop-$i.log 2>&1; then
              echo "iteration $i: ok"
            else
              echo "iteration $i: FAILED"
              fails=$((fails + 1))
            fi
          done
          kill $hogs
          echo "loop failures: $fails/30"
          echo "loop_failures=$fails" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## vhost-user/reconnect on ${{ matrix.os }}"
            echo
            echo "All qos tests (no arguments) outcome: ${{ steps.virtio.outcome }}"
            echo "Stress step outcome: ${{ steps.stress.outcome }}"
            echo "Loop failures: ${{ steps.loop.outputs.loop_failures }}/30"
            echo
            if grep -rq 'wait_for_fds: assertion failed' stress.log loop-*.log build/meson-logs 2>/dev/null; then
              echo "**REPRODUCED**: wait_for_fds assertion seen"
            else
              echo "**NOT REPRODUCED**: wait_for_fds assertion not seen"
            fi
            echo
            echo '```'
            grep -h -E 'vhost-user/reconnect|^Ok:|^Fail:|^Timeout:|Summary of Failures|qos-test +(OK|ERROR|FAIL|TIMEOUT)' stress.log 2>/dev/null || true
            echo '```'
            echo
            echo "### vhost-user tests (from the full qos-test run)"
            echo '```'
            grep -E '^(ok|not ok) ' virtio.log 2>/dev/null | grep vhost-user | sed -E "s|$PCI_BUS/||" || true
            echo '```'
            echo
            echo "### All qos tests by device (ok / not ok)"
            echo '```'
            grep -E '^(ok|not ok) ' virtio.log 2>/dev/null \
              | sed -E "s#^(ok|not ok) [0-9]+ $PCI_BUS/#\\1 #; s#^(ok|not ok) [0-9]+ /ppc64/#\\1 #" \
              | awk '{ p = ($1 == "ok") ? $2 : $3; split(p, a, "/"); k = a[1]; if ($1 == "ok") ok[k]++; else bad[k]++ }
                     END { for (k in ok) if (!(k in bad)) bad[k] = 0; for (k in bad) if (!(k in ok)) ok[k] = 0;
                           for (k in ok) printf "%-28s %3d / %d\n", k, ok[k], bad[k] }' | sort || true
            echo '```'
            echo
            echo "### Failing qos tests, if any"
            echo '```'
            grep -E '^not ok ' virtio.log 2>/dev/null | cut -c1-200 || true
            echo '```'
            echo
            echo "### Diagnostic run (up to 250 lines, TAP comments stripped)"
            echo '```'
            grep -v '^# ' diag.log 2>/dev/null | head -250 || true
            echo '```'
            echo
            echo "### Loop iteration 1 (up to 120 lines, TAP comments stripped)"
            echo '```'
            grep -v '^# ' loop-1.log 2>/dev/null | head -120 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -rl 'wait_for_fds: assertion failed' stress.log loop-*.log build/meson-logs 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            stress.log
            diag.log
            virtio.log
            loop-*.log
            build/meson-logs/
            build/config.log
          if-no-files-found: ignore

  # FreeBSD: GitHub has no FreeBSD runners, so run a FreeBSD VM inside an
  # Ubuntu runner (cross-platform-actions uses QEMU, KVM-accelerated where the
  # runner allows it) and execute the same steps inside the VM.
  repro-freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PCI_BUS: /ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus
    steps:
      - uses: actions/checkout@v4

      - name: Build and test inside a FreeBSD VM
        id: vm
        continue-on-error: true
        uses: cross-platform-actions/action@v0.28.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          cpu_count: 4
          memory: 12G
          shell: bash
          sync_files: true
          run: |
            set -o pipefail
            PPC64_TESTS="qtest-ppc64/qos-test qtest-ppc64/device-introspect-test qtest-ppc64/cdrom-test qtest-ppc64/migration-test qtest-ppc64/prom-env-test qtest-ppc64/boot-serial-test"
            RECONNECT=/ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus/virtio-net-pci/virtio-net/virtio-net-tests/vhost-user/reconnect
            NCPU=$(sysctl -n hw.ncpu)
            uname -a; freebsd-version; echo "cpus: $NCPU"
            mkdir -p freebsd-logs
            sudo pkg install -y bash coreutils dtc gettext git glib gmake gnutls gsed meson ninja pixman pkgconf python3 zstd
            PYVER=$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')
            sudo pkg install -y py${PYVER}-setuptools py${PYVER}-wheel py${PYVER}-tomli || true
            mkdir build && cd build
            ../configure \
              --extra-cflags=-I/usr/local/include \
              --extra-ldflags=-L/usr/local/lib \
              --target-list=ppc64-softmmu \
              --enable-vhost-user \
              --enable-vhost-user-blk-server \
              --disable-docs \
              --disable-rust \
              --disable-plugins \
              --disable-werror \
              || { cat config.log meson-logs/meson-log.txt; exit 1; }
            gmake -j$NCPU
            gmake -j$NCPU check-build
            export QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img
            export QTEST_QEMU_STORAGE_DAEMON_BINARY=./storage-daemon/qemu-storage-daemon
            echo "== all qos tests (no arguments)"
            ./tests/qtest/qos-test 2>&1 | tee ../freebsd-logs/virtio.log || true
            echo "== stress run"
            gmake -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 $PPC64_TESTS" 2>&1 | tee ../freebsd-logs/stress.log || true
            echo "== reconnect loop under CPU load"
            hogs=""
            for i in $(seq 1 $((NCPU * 2))); do yes > /dev/null & hogs="$hogs $!"; done
            fails=0
            for i in $(seq 1 30); do
              if ./tests/qtest/qos-test -p $RECONNECT > ../freebsd-logs/loop-$i.log 2>&1; then
                echo "iteration $i: ok"
              else
                echo "iteration $i: FAILED"; fails=$((fails + 1))
              fi
            done
            kill $hogs
            echo "loop failures: $fails/30" | tee ../freebsd-logs/loop-summary.txt
            cp meson-logs/testlog.txt ../freebsd-logs/ 2>/dev/null || true
            cd .. && rm -rf build

      - name: Report
        if: always()
        run: |
          {
            echo "## vhost-user/reconnect on FreeBSD 14.2 (VM on ${{ runner.os }})"
            echo
            echo "VM step outcome: ${{ steps.vm.outcome }}"
            cat freebsd-logs/loop-summary.txt 2>/dev/null || echo "loop: no result"
            echo
            if grep -rq 'wait_for_fds: assertion failed' freebsd-logs 2>/dev/null; then
              echo "**REPRODUCED**: wait_for_fds assertion seen"
            else
              echo "**NOT REPRODUCED**: wait_for_fds assertion not seen"
            fi
            echo
            echo '```'
            grep -h -E 'vhost-user/reconnect|^Ok:|^Fail:|^Timeout:|Summary of Failures|qos-test +(OK|ERROR|FAIL|TIMEOUT)' freebsd-logs/stress.log 2>/dev/null || true
            echo '```'
            echo
            echo "### vhost-user tests (from the full qos-test run)"
            echo '```'
            grep -E '^(ok|not ok) ' freebsd-logs/virtio.log 2>/dev/null | grep vhost-user | sed -E "s|$PCI_BUS/||" || true
            echo '```'
            echo
            echo "### All qos tests by device (ok / not ok)"
            echo '```'
            grep -E '^(ok|not ok) ' freebsd-logs/virtio.log 2>/dev/null \
              | sed -E "s#^(ok|not ok) [0-9]+ $PCI_BUS/#\\1 #; s#^(ok|not ok) [0-9]+ /ppc64/#\\1 #" \
              | awk '{ p = ($1 == "ok") ? $2 : $3; split(p, a, "/"); k = a[1]; if ($1 == "ok") ok[k]++; else bad[k]++ }
                     END { for (k in ok) if (!(k in bad)) bad[k] = 0; for (k in bad) if (!(k in ok)) ok[k] = 0;
                           for (k in ok) printf "%-28s %3d / %d\n", k, ok[k], bad[k] }' | sort || true
            echo '```'
            echo
            echo "### Failing qos tests, if any"
            echo '```'
            grep -E '^not ok ' freebsd-logs/virtio.log 2>/dev/null | cut -c1-200 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-freebsd-14.2
          path: freebsd-logs/
          if-no-files-found: ignore

  # OpenBSD: same approach as FreeBSD, with the package set from
  # tests/vm/generated/openbsd.json.
  repro-openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PCI_BUS: /ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus
    steps:
      - uses: actions/checkout@v4

      - name: Build and test inside an OpenBSD VM
        id: vm
        continue-on-error: true
        uses: cross-platform-actions/action@v0.28.0
        with:
          operating_system: openbsd
          version: '7.7'
          architecture: x86-64
          cpu_count: 4
          memory: 12G
          shell: bash
          sync_files: true
          run: |
            set -o pipefail
            PPC64_TESTS="qtest-ppc64/qos-test qtest-ppc64/device-introspect-test qtest-ppc64/cdrom-test qtest-ppc64/migration-test qtest-ppc64/prom-env-test qtest-ppc64/boot-serial-test"
            RECONNECT=/ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus/virtio-net-pci/virtio-net/virtio-net-tests/vhost-user/reconnect
            NCPU=$(sysctl -n hw.ncpu)
            uname -a; uname -r; echo "cpus: $NCPU"
            mkdir -p openbsd-logs
            SUDO=sudo; command -v sudo >/dev/null 2>&1 || SUDO=doas
            # OpenBSD 7.7's default python3 is 3.12 (QEMU needs >= 3.12)
            $SUDO pkg_add -I bash bison bzip2 dtc git glib2 gmake gsed libffi meson ninja pkgconf python3
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/X11R6/lib/pkgconfig
            mkdir build && cd build
            ../configure --cc=cc --python=/usr/local/bin/python3 \
              --extra-cflags="-I/usr/local/include -I/usr/X11R6/include" \
              --extra-ldflags="-L/usr/local/lib -L/usr/X11R6/lib" \
              --target-list=ppc64-softmmu \
              --enable-vhost-user \
              --enable-vhost-user-blk-server \
              --disable-docs \
              --disable-rust \
              --disable-plugins \
              --disable-werror \
              || { cat config.log meson-logs/meson-log.txt; exit 1; }
            gmake -j$NCPU
            gmake -j$NCPU check-build
            # The tests run in a fresh login of the "staff" class so the
            # data-size limit can be lifted: OpenBSD charges anonymous mmap to
            # RLIMIT_DATA and the default class caps it below what a TCG
            # pseries guest needs (512 MiB RAM plus the 1 GiB code buffer), so
            # boot-serial-test's QEMU died with "Cannot set up 512 MiB of guest
            # memory 'ppc_spapr.ram': Cannot allocate memory" (runs 22 and 24).
            cat > ../openbsd-tests.sh <<'EOS'
            set -o pipefail
            PPC64_TESTS="qtest-ppc64/qos-test qtest-ppc64/device-introspect-test qtest-ppc64/cdrom-test qtest-ppc64/migration-test qtest-ppc64/prom-env-test qtest-ppc64/boot-serial-test"
            RECONNECT=/ppc64/pseries/spapr-pci-host-bridge/pci-bus-spapr/pci-bus/virtio-net-pci/virtio-net/virtio-net-tests/vhost-user/reconnect
            NCPU=$(sysctl -n hw.ncpu)
            echo "datasize limit in test login: $(ulimit -d) KiB (hard $(ulimit -H -d))"
            export QTEST_QEMU_BINARY=./qemu-system-ppc64 QTEST_QEMU_IMG=./qemu-img
            export QTEST_QEMU_STORAGE_DAEMON_BINARY=./storage-daemon/qemu-storage-daemon
            echo "== all qos tests (no arguments)"
            ./tests/qtest/qos-test 2>&1 | tee ../openbsd-logs/virtio.log || true
            echo "== stress run"
            gmake -j6 check-qtest-ppc64 MTESTARGS="--repeat 5 $PPC64_TESTS" 2>&1 | tee ../openbsd-logs/stress.log || true
            echo "== reconnect loop under CPU load"
            hogs=""
            for i in $(seq 1 $((NCPU * 2))); do yes > /dev/null & hogs="$hogs $!"; done
            fails=0
            for i in $(seq 1 30); do
              if ./tests/qtest/qos-test -p $RECONNECT > ../openbsd-logs/loop-$i.log 2>&1; then
                echo "iteration $i: ok"
              else
                echo "iteration $i: FAILED"; fails=$((fails + 1))
              fi
            done
            kill $hogs
            echo "loop failures: $fails/30" | tee ../openbsd-logs/loop-summary.txt
            cp meson-logs/testlog.txt ../openbsd-logs/ 2>/dev/null || true
            EOS
            echo "datasize limit in build shell: $(ulimit -d) KiB (hard $(ulimit -H -d))"
            $SUDO su -c staff -l "$(id -un)" -c "cd $PWD && ulimit -d unlimited && bash ../openbsd-tests.sh"
            cd .. && rm -rf build

      - name: Report
        if: always()
        run: |
          {
            echo "## vhost-user/reconnect on OpenBSD 7.7 (VM on ${{ runner.os }})"
            echo
            echo "VM step outcome: ${{ steps.vm.outcome }}"
            cat openbsd-logs/loop-summary.txt 2>/dev/null || echo "loop: no result"
            echo
            if grep -rq 'wait_for_fds: assertion failed' openbsd-logs 2>/dev/null; then
              echo "**REPRODUCED**: wait_for_fds assertion seen"
            else
              echo "**NOT REPRODUCED**: wait_for_fds assertion not seen"
            fi
            echo
            echo '```'
            grep -h -E 'vhost-user/reconnect|^Ok:|^Fail:|^Timeout:|Summary of Failures|qos-test +(OK|ERROR|FAIL|TIMEOUT)' openbsd-logs/stress.log 2>/dev/null || true
            echo '```'
            echo
            echo "### vhost-user tests (from the full qos-test run)"
            echo '```'
            grep -E '^(ok|not ok) ' openbsd-logs/virtio.log 2>/dev/null | grep vhost-user | sed -E "s|$PCI_BUS/||" || true
            echo '```'
            echo
            echo "### All qos tests by device (ok / not ok)"
            echo '```'
            grep -E '^(ok|not ok) ' openbsd-logs/virtio.log 2>/dev/null \
              | sed -E "s#^(ok|not ok) [0-9]+ $PCI_BUS/#\\1 #; s#^(ok|not ok) [0-9]+ /ppc64/#\\1 #" \
              | awk '{ p = ($1 == "ok") ? $2 : $3; split(p, a, "/"); k = a[1]; if ($1 == "ok") ok[k]++; else bad[k]++ }
                     END { for (k in ok) if (!(k in bad)) bad[k] = 0; for (k in bad) if (!(k in ok)) ok[k] = 0;
                           for (k in ok) printf "%-28s %3d / %d\n", k, ok[k], bad[k] }' | sort || true
            echo '```'
            echo
            echo "### Failing qos tests, if any"
            echo '```'
            grep -E '^not ok ' openbsd-logs/virtio.log 2>/dev/null | cut -c1-200 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-openbsd-7.7
          path: openbsd-logs/
          if-no-files-found: ignore

  # A conventional macOS (Apple silicon) build of qemu-system-x86_64 plus
  # qemu-storage-daemon and the tools, installed into a relocatable prefix and
  # uploaded as a tarball for manual testing.  Builds the commit the workflow
  # runs on.
  build-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install bash capstone coreutils dtc gettext glib gnutls jpeg-turbo libpng \
            libslirp libssh libusb lzo make meson ninja pixman pkgconf python3 snappy zstd

      - name: Configure
        run: |
          mkdir build && cd build
          prefix=$(brew --prefix)
          ../configure \
            --extra-cflags="-I$prefix/include" \
            --extra-ldflags="-L$prefix/lib" \
            --prefix="$PWD/../install" \
            --target-list=x86_64-softmmu \
            --enable-vhost-user \
            --enable-vhost-user-blk-server \
            --enable-cocoa \
            --enable-vnc \
            --enable-slirp \
            --enable-virtfs \
            --enable-tools \
            --disable-rust \
            --disable-docs \
            --disable-werror \
            || { cat config.log meson-logs/meson-log.txt; exit 1; }

      - name: Build and install
        run: |
          cd build
          gmake -j$(sysctl -n hw.ncpu)
          gmake install
          ls -l ../install/bin

      - name: Smoke test
        run: |
          install/bin/qemu-system-x86_64 --version
          install/bin/qemu-storage-daemon --version
          install/bin/qemu-img --version
          install/bin/qemu-system-x86_64 -machine help | grep -E '^(q35|pc|microvm) '
          install/bin/qemu-system-x86_64 -device help | grep -E 'vhost-user-(net|blk)' || true
          install/bin/qemu-storage-daemon --export help 2>&1 | head -5 || true

      - name: Package
        run: |
          rev=$(git rev-parse --short HEAD)
          echo "commit $rev, built $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(sw_vers -productVersion) $(uname -m)" > install/BUILD-INFO
          echo "ref: ${{ github.ref_name }}" >> install/BUILD-INFO
          tar -C install -czf qemu-macos-arm64-$rev.tar.gz .
          ls -lh qemu-macos-arm64-$rev.tar.gz

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: qemu-macos-arm64-x86_64-softmmu
          path: qemu-macos-arm64-*.tar.gz
          if-no-files-found: error
